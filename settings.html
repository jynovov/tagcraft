<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TagCraft · 设置</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <div id="sidebar"></div>

  <div class="main">
    <div class="page-head">
      <h1 class="page-title">设置</h1>
      <span class="head-right">
        <span id="saveHint" class="page-sub">改动会自动保存</span>
        <span id="dictStatus" class="pill">词表加载中…</span>
      </span>
    </div>

    <div class="stack">
      <div class="card">
        <div class="card-title">大模型</div>
        <div class="field">
          <label>接口地址（OpenAI 兼容）</label>
          <input id="apiBase" class="mono" placeholder="https://api.deepseek.com/v1/chat/completions">
        </div>
        <div class="grid2">
          <div class="field">
            <label>模型名</label>
            <input id="model" class="mono" placeholder="deepseek-flash">
          </div>
          <div class="field">
            <label>温度（0.2 稳 / 0.9 活）</label>
            <input id="temperature" type="number" min="0" max="1.5" step="0.1" value="0.6">
          </div>
        </div>
        <div class="field">
          <label>API Key</label>
          <input id="apiKey" type="password" class="mono" placeholder="sk-…">
        </div>
        <div class="field">
          <label>辅助模型名（可空，空 = 用主模型）</label>
          <input id="auxModel" class="mono" placeholder="计划 / 评审用，例如 deepseek-flash">
        </div>
        <div class="row">
          <button id="btnSave" class="primary">保存</button>
          <button id="btnTest">测试连接</button>
          <span id="testMsg" class="page-sub"></span>
        </div>
      </div>

      <div class="card">
        <div class="card-title">智能体</div>
        <div class="grid2">
          <div class="field">
            <label>工具调用最大轮数</label>
            <input id="agentRounds" type="number" min="1" max="12" value="6">
          </div>
          <div class="field">
            <label>自省轮数（tag 最多修几轮 / Krea 评审几轮，0 = 关闭）</label>
            <input id="reflectRounds" type="number" min="0" max="4" value="2">
          </div>
        </div>
        <label class="inline check" style="margin-top:12px">
          <input id="plan" type="checkbox"> 规划展示
        </label>
      </div>

      <div class="card">
        <div class="card-title">
          系统提示词 · NoobAI 系（Danbooru tag）
          <span class="spacer"></span>
          <button id="btnResetPrompt" class="small ghost">恢复默认</button>
        </div>
        <textarea id="systemPrompt" rows="12" class="mono"></textarea>
        <div class="row">
          <button id="btnSavePrompt" class="primary">保存提示词</button>
        </div>
      </div>

      <div class="card">
        <div class="card-title">
          系统提示词 · Krea 2（英文自然语言）
          <span class="spacer"></span>
          <button id="btnResetPromptKrea" class="small ghost">恢复默认</button>
        </div>
        <textarea id="systemPromptKrea" rows="12" class="mono"></textarea>
        <div class="row">
          <button id="btnSavePromptKrea" class="primary">保存提示词</button>
        </div>
      </div>

      <div class="card">
        <div class="card-title">词表</div>
        <div class="row" style="margin-top:0">
          <select id="dictSource" style="flex:1;min-width:0"></select>
          <button id="btnUpdateDict">更新词表</button>
        </div>
        <div id="dictInfo" class="page-sub" style="margin-top:10px"></div>
      </div>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script src="settings.js"></script>
</body>
</html>
