<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TagCraft · Krea2 提示词</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <div id="sidebar"></div>

  <div class="main">
    <div class="page-head">
      <h1 class="page-title">Krea 2 提示词</h1>
      <span class="head-right">
        <span id="kreaStatus" class="pill">英文自然语言</span>
      </span>
    </div>

    <div id="modelSwitch" class="model-switch"></div>

    <div class="layout">
      <!-- 左：输入 + 术语对照 -->
      <div class="col">
        <div class="card">
          <div class="card-title">描述画面（中文）</div>
          <textarea id="inputText" rows="11"
            placeholder="中文描述，可以写很长（Ctrl+Enter 生成）"></textarea>
          <div class="row">
            <button id="btnExample" class="small ghost" title="随机挑几条中文示例，点一条填入">示例</button>
          </div>
          <div class="row">
            <label class="inline check" title="让模型先查中英术语对照，再写提示词；自省由设置页控制">
              <input id="useAgent" type="checkbox" checked> Agent 模式
            </label>
            <span class="page-sub">自省看设置</span>
          </div>
          <div class="row">
            <button id="btnGenerate" class="primary wide">生成提示词</button>
            <button id="btnClear" class="ghost">清空</button>
          </div>
          <div class="hint-line">英文自然语言，不用 tag 和权重语法。</div>
        </div>

        <div class="card">
          <div class="card-title">术语对照（中 → 英）</div>
          <div class="row" style="margin-top:0">
            <input id="termInput" type="text" placeholder="例如：过膝袜 / 逆光" style="flex:1;min-width:0">
            <button id="btnTerm">查</button>
          </div>
          <div id="termResults" class="list scroll"></div>
        </div>
      </div>

      <!-- 右：结果 -->
      <div class="col">
        <div class="card">
          <div class="card-title">
            结果
            <span class="spacer"></span>
            <button id="btnFav" class="small">★ 收藏这套</button>
          </div>
          <div id="genStats" class="stats"></div>
          <div id="progress" class="progress"></div>

          <details id="planBox" class="fold" open>
            <summary id="planSum">画面规划</summary>
            <div id="plan" class="fold-body"></div>
          </details>

          <details id="traceBox" class="fold">
            <summary id="traceSum">智能体工具调用轨迹</summary>
            <div id="trace" class="fold-body"></div>
          </details>

          <details id="reviewBox" class="fold">
            <summary id="reviewSum">自省评审</summary>
            <div id="review" class="fold-body"></div>
          </details>

          <div id="notes" class="notes"></div>
          <div id="warnLine" class="warn-line"></div>

          <label>英文提示词</label>
          <textarea id="outPrompt" rows="9" placeholder="生成后会出现在这里"></textarea>
          <div class="row">
            <span id="promptCount" class="prompt-count">0 词</span>
            <span class="spacer" style="flex:1"></span>
            <button id="btnCopyPrompt" class="small primary">复制提示词</button>
          </div>
          <div class="row">
            <button id="btnSendComfy" class="primary wide">发送到 ComfyUI</button>
            <a href="/comfy.html" class="page-sub">去配置 ComfyUI →</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script src="krea.js"></script>
</body>
</html>
