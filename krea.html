<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TagCraft · Krea2 提示词</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <div id="sidebar"></div>

  <div class="main main-split">
    <div class="page-head">
      <h1 class="page-title">Krea 2 提示词</h1>
      <span class="head-right">
        <span id="kreaStatus" class="pill">英文自然语言</span>
      </span>
    </div>

    <div id="modelSwitch" class="model-switch"></div>

    <div class="layout">
      <!-- 左：输入 -->
      <div class="col">
        <div class="card">
          <div class="card-title">描述画面（中文）</div>
          <textarea id="inputText" rows="11"
            placeholder="中文描述，可以写很长（Ctrl+Enter 生成）"></textarea>
          <div class="row">
            <button id="btnExample" class="small ghost" title="随机挑几条中文示例，点一条填入">示例</button>
          </div>
          <div class="row">
            <label class="inline check" title="开 = 生成后自动评审并改写；关 = 只做单次生成，不评审">
              <input id="useAgent" type="checkbox" checked> 自省
            </label>
              </div>
          <div class="row">
            <button id="btnGenerate" class="primary wide">生成提示词</button>
            <button id="btnClear" class="ghost">清空</button>
          </div>
            </div>
      </div>

      <!-- 右：结果 -->
      <div class="col">
        <div class="card">
          <div class="card-title">
            结果
            <span class="spacer"></span>
            <button id="btnFav" class="small">★ 收藏这套</button>
          </div>
          <div id="genStats" class="stats"></div>
          <div id="progress" class="progress"></div>

          <details id="planBox" class="fold" open>
            <summary id="planSum">画面规划</summary>
            <div id="plan" class="fold-body"></div>
          </details>

          <details id="traceBox" class="fold">
            <summary id="traceSum">生成轨迹</summary>
            <div id="trace" class="fold-body"></div>
          </details>

          <details id="reviewBox" class="fold">
            <summary id="reviewSum">自省评审</summary>
            <div id="review" class="fold-body"></div>
          </details>

          <div id="notes" class="notes"></div>
          <div id="warnLine" class="warn-line"></div>

          <label>英文提示词</label>
          <textarea id="outPrompt" rows="9" placeholder="生成后会出现在这里"></textarea>
          <div class="row">
            <span id="promptCount" class="prompt-count">0 词</span>
            <span class="spacer" style="flex:1"></span>
            <button id="btnTranslate" class="small">译成中文</button>
            <button id="btnCopyPrompt" class="small primary">复制提示词</button>
          </div>
          <!-- 译文块：默认不显示，点「译成中文」才出现（只读，不改进提示词） -->
          <div id="transBox" class="trans-box" hidden>
            <div class="trans-head">
              <span>中文翻译</span>
              <span class="spacer"></span>
              <button id="btnTransClose" class="small ghost">收起</button>
            </div>
            <div id="transOut" class="trans-out"></div>
          </div>
          <div class="row">
            <button id="btnSendComfy" class="primary small">发送到 ComfyUI</button>
            <a href="/comfy.html" class="page-sub">去配置 ComfyUI →</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="store.js"></script>
<script src="ui_fx.js"></script>
<script src="common.js"></script>
<script src="gen_page.js"></script>
<script src="krea.js"></script>
</body>
</html>
