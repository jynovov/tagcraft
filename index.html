<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TagCraft · 中文转 tag</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <div id="sidebar"></div>

  <div class="main">
    <div class="page-head">
      <h1 class="page-title">中文转 tag</h1>
      <span class="head-right">
        <span id="dictStatus" class="pill">词表加载中…</span>
      </span>
    </div>

    <div id="modelSwitch" class="model-switch"></div>

    <div class="layout">
      <!-- 左：输入 + 查词 -->
      <div class="col">
        <div class="card">
          <div class="card-title">描述画面</div>
          <textarea id="inputText" rows="10"
            placeholder="用中文描述你想画的画面，可以写很长（Ctrl+Enter 生成）"></textarea>
          <div class="row">
            <button id="btnExample" class="small ghost" title="随机挑几条中文示例，点一条填入">示例</button>
          </div>
          <div class="row">
            <label class="inline">上限
              <input id="maxTags" type="number" min="10" max="80" value="40">
            </label>
            <label class="inline check" title="让模型自己决定查词表，并自我评审重写">
              <input id="useAgent" type="checkbox" checked> Agent 模式
            </label>
          </div>
          <div class="row">
            <button id="btnGenerate" class="primary wide">生成 tag</button>
            <button id="btnClear" class="ghost">清空</button>
          </div>
        </div>

        <div class="card">
          <div class="card-title">查词</div>
          <div class="row" style="margin-top:0">
            <input id="searchInput" type="text" placeholder="中文或英文" style="flex:1;min-width:0">
            <button id="btnSearch">搜索</button>
          </div>
          <div class="row">
            <select id="searchCat">
              <option value="all">全部分类</option>
              <option value="0">常规</option>
              <option value="1">画师</option>
              <option value="3">作品</option>
              <option value="4">角色</option>
              <option value="5">元数据</option>
            </select>
          </div>
          <div id="searchResults" class="list scroll"></div>
        </div>
      </div>

      <!-- 右：结果 -->
      <div class="col">
        <div class="card">
          <div class="card-title">
            结果
            <span class="spacer"></span>
            <button id="btnFav" class="small">★ 收藏这套</button>
            <button id="btnValidate" class="small ghost">重新校验</button>
          </div>
          <div id="genStats" class="stats"></div>
          <div id="progress" class="progress"></div>

          <details id="planBox" class="fold" open>
            <summary id="planSum">画面规划</summary>
            <div id="plan" class="fold-body"></div>
          </details>

          <details id="traceBox" class="fold">
            <summary id="traceSum">智能体工具调用轨迹</summary>
            <div id="trace" class="fold-body"></div>
          </details>

          <details id="reviewBox" class="fold">
            <summary id="reviewSum">自省评审</summary>
            <div id="review" class="fold-body"></div>
          </details>

          <div id="notes" class="notes"></div>

          <div class="group">
            <div class="group-title">
              质量词 <span id="qCount" class="count">0</span>
              <span class="spacer"></span>
              <button id="btnQualityPreset" class="small ghost">+ 标准质量词</button>
            </div>
            <div id="qTags" class="tags"></div>
          </div>

          <div class="group">
            <div class="group-title">正向 tag <span id="posCount" class="count">0</span></div>
            <div id="posTags" class="tags"></div>
          </div>

          <div class="group" id="candGroup" hidden>
            <div class="group-title">候选补充 <span id="candCount" class="count">0</span></div>
            <div id="candTags" class="unk-list"></div>
          </div>

          <div class="group">
            <div class="group-title">未识别 <span id="unkCount" class="count">0</span></div>
            <div id="unkTags" class="unk-list"></div>
          </div>

          <div class="group">
            <div class="group-title">
              负向 tag <span id="negCount" class="count">0</span>
              <span class="spacer"></span>
              <button id="btnNegBase" class="small ghost">+ 基础负向</button>
              <button id="btnNegAnatomy" class="small ghost">+ 防崩负向</button>
            </div>
            <div id="negTags" class="tags"></div>
          </div>
        </div>

        <div class="card">
          <div class="card-title">输出</div>

          <label>质量词</label>
          <textarea id="outQuality" rows="2" class="mono"></textarea>
          <div class="row">
            <button id="btnCopyQuality" class="small">复制质量词</button>
            <button id="btnCopyAll" class="small primary">复制完整正向</button>
            <label class="inline check" style="margin-left:auto">
              <input id="useWeight" type="checkbox"> 权重语法
            </label>
          </div>

          <label style="margin-top:14px">正向 tag</label>
          <textarea id="outPos" rows="3" class="mono"></textarea>
          <div class="row"><button id="btnCopyPos" class="small">复制正向</button></div>

          <label style="margin-top:14px">负向 tag</label>
          <textarea id="outNeg" rows="3" class="mono"></textarea>
          <div class="row">
            <button id="btnCopyNeg" class="small">复制负向</button>
            <button id="btnSendComfy" class="primary wide">发送到 ComfyUI</button>
          </div>
          <div class="row">
            <a href="/comfy.html" class="page-sub">还没配 ComfyUI？去 ComfyUI 页粘贴工作流 →</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script src="app.js"></script>
</body>
</html>
